# See https://golangci-lint.run/docs/configuration/file/.
# Tighten the selected checks as the code improves.

version: "2"
run:
  concurrency: 4
  timeout: 5m
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - dogsled
    - errcheck
    - errname
    - errorlint
    - forcetypeassert
    - gocritic
    - gocyclo
    - gomodguard
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nilnil
    - noctx
    - paralleltest
    - revive
    - staticcheck
    # Test public behavior externally; private helpers use *_internal_test.go.
    - testpackage
    - tparallel
    - unconvert
    - unused
    - usetesting
  settings:
    gocognit:
      min-complexity: 46
    goconst:
      min-len: 4
      min-occurrences: 3
    gocritic:
      enabled-checks:
        - argOrder
        - badCond
        - badLock
        - badRegexp
        - boolExprSimplify
        - builtinShadowDecl
        - captLocal
        - caseOrder
        - codegenComment
        - commentedOutImport
        - commentFormatting
        - defaultCaseOrder
        - deferUnlambda
        - dupArg
        - dupBranchBody
        - dupCase
        - dupImport
        - dupSubExpr
        - emptyFallthrough
        - flagDeref
        - flagName
        - hexLiteral
        - indexAlloc
        - initClause
        - mapKey
        - methodExprCall
        - newDeref
        - nilValReturn
        - offBy1
        - regexpMust
        - regexpPattern
        - ruleguard
        - singleCaseSwitch
        - sloppyLen
        - sloppyTypeAssert
        - sortSlice
        - sprintfQuotedString
        - sqlQuery
        - switchTrue
        - truncateCmp
        - typeAssertChain
        - typeSwitchVar
        - underef
        - valSwap
        - weakCond
      settings:
        ruleguard:
          failOn: all
          rules: ${base-path}/scripts/rules.go
    gocyclo:
      min-complexity: 50
    importas:
      no-unaliased: true
    misspell:
      locale: US
      ignore-rules:
        - trialer
    nestif:
      min-complexity: 4
    revive:
      severity: warning
      rules:
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: flag-parameter
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    staticcheck:
      # Keep xerrors for stack frames; its deprecation is intentional.
      checks:
        - SA*
        - S*
        - -SA1019
    usetesting:
      # Require automatic environment cleanup in tests.
      os-setenv: true
      os-create-temp: false
      os-mkdir-temp: false
      os-temp-dir: false
      os-chdir: false
      context-background: false
      context-todo: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests use assertions to check errors.
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - node_modules
      - cli/cliflag
      - scripts/rules.go
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - coder.com
        - cdr.dev
        - go.coder.com
        - github.com/cdr
        - github.com/coder
  exclusions:
    generated: lax
    paths:
      - node_modules
      - cli/cliflag
      - scripts/rules.go
      - third_party$
      - builtin$
      - examples$
